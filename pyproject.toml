[project]
name = "yuan"
version = "0.1.0"
description = "Concurrent Douyin and WeChat article search with LLM summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "playwright>=1.49.0",
    "requests>=2.33.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
yuan = "yuan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
